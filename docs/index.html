<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Price Charming</title>
<style>
:root {
  --gold:#d4a843; --gold-dim:#a67c2e; --purple:#4a2060; --deep:#2a0e3a;
  --lite:#6b3a8a; --parch:#f5e6c8; --parch-d:#e8d4a8; --green:#3a7a3a;
  --red:#a03030; --blue:#3a6a9a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Georgia,'Times New Roman',serif;background:var(--deep);color:var(--parch);min-height:100vh;overflow-x:hidden}

/* TITLE SCREEN */
#title-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;background:radial-gradient(ellipse at center,var(--purple) 0%,var(--deep) 70%)}
#title-screen h1{font-size:4rem;color:var(--gold);text-shadow:0 0 30px rgba(212,168,67,.4);letter-spacing:.08em;margin-bottom:.5rem}
#title-screen .sub{color:var(--parch-d);font-style:italic;font-size:1.2rem;margin-bottom:2rem}
#title-screen .ver{background:var(--gold-dim);color:var(--deep);padding:.25rem 1rem;border-radius:1rem;font-size:.8rem;font-weight:bold;margin-bottom:2rem}
.btn{background:linear-gradient(180deg,var(--gold) 0%,var(--gold-dim) 100%);color:var(--deep);border:none;padding:.75rem 2.5rem;font-family:inherit;font-size:1.1rem;font-weight:bold;border-radius:6px;cursor:pointer;transition:transform .15s,box-shadow .15s;text-transform:uppercase;letter-spacing:.05em}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(212,168,67,.4)}
.btn:active{transform:translateY(0)}
.btn-sm{padding:.4rem 1rem;font-size:.85rem}
.btn-danger{background:linear-gradient(180deg,#c04040,#8a2a2a)}
.btn-danger:hover{box-shadow:0 4px 15px rgba(160,48,48,.4)}
.btn-blue{background:linear-gradient(180deg,#5a8aba,var(--blue))}

/* TOP BAR */
#game-screen{display:none;min-height:100vh;flex-direction:column}
#top-bar{background:var(--purple);border-bottom:3px solid var(--gold);padding:.6rem 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem}
#top-bar .info{display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap}
#top-bar .label{color:var(--parch-d);font-size:.85rem}
#top-bar .val{color:var(--gold);font-weight:bold;font-size:1.1rem}
#rep-bar-wrap{width:280px;height:22px;background:#1a0a1e;border:2px solid var(--gold-dim);border-radius:11px;position:relative;overflow:hidden}
#rep-bar-fill{height:100%;width:50%;background:linear-gradient(90deg,var(--red),var(--gold-dim),var(--green));border-radius:9px;transition:width .5s}
#rep-bar-mid{position:absolute;left:50%;top:0;width:2px;height:100%;background:var(--parch);opacity:.5}
#rep-text{position:absolute;width:100%;text-align:center;font-size:.7rem;line-height:22px;color:var(--parch);font-weight:bold}

/* GAME AREA */
#game-area{flex:1;display:flex;flex-direction:column;padding:1rem;max-width:1100px;margin:0 auto;width:100%}

/* PHASE LABEL */
#phase-label{text-align:center;color:var(--gold);font-size:1.3rem;margin-bottom:.75rem;font-weight:bold;min-height:2rem}

/* OPPONENT BOARD */
.board-section{margin-bottom:.75rem}
.board-section .board-title{color:var(--parch-d);font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.4rem}
.board-slots{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;min-height:130px;align-items:flex-start}

/* CARDS */
.card{background:linear-gradient(135deg,var(--purple),var(--lite));border:2px solid var(--gold-dim);border-radius:8px;padding:.6rem;width:140px;min-height:120px;position:relative;transition:transform .2s,border-color .2s,box-shadow .2s;cursor:default;flex-shrink:0}
.card:hover{border-color:var(--gold);box-shadow:0 0 10px rgba(212,168,67,.3)}
.card.clickable{cursor:pointer}
.card.clickable:hover{transform:translateY(-4px)}
.card .emoji{font-size:1.8rem;text-align:center;margin-bottom:.2rem}
.card .c-name{color:var(--gold);font-weight:bold;font-size:.85rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .c-tribe{font-size:.65rem;background:var(--gold-dim);color:var(--deep);padding:1px 6px;border-radius:8px;display:inline-block;font-weight:bold;margin:2px auto;text-align:center}
.card .c-info{font-size:.7rem;color:var(--parch-d);margin-top:3px;line-height:1.3}
.card .c-cost{position:absolute;top:4px;right:6px;background:var(--gold);color:var(--deep);font-weight:bold;font-size:.75rem;padding:1px 6px;border-radius:8px}
.card .c-timer-bar{height:4px;background:#1a0a1e;border-radius:2px;margin-top:4px;overflow:hidden}
.card .c-timer-fill{height:100%;background:var(--green);transition:width .1s linear;border-radius:2px}
.card.exhausted{opacity:.4;filter:grayscale(.5)}
.card.selling{border-color:#5f5;box-shadow:0 0 15px rgba(80,255,80,.5);animation:sellPulse .3s}
.card .sell-btn{position:absolute;bottom:4px;right:4px;background:var(--red);color:var(--parch);border:none;font-size:.6rem;padding:1px 5px;border-radius:4px;cursor:pointer;font-family:inherit}
.card.spell-card{border-color:#7a5aaa;background:linear-gradient(135deg,#3a1860,#5a3080)}
.card.spell-card:hover{border-color:#b090d0;box-shadow:0 0 10px rgba(180,140,220,.4)}

/* EMPTY SLOT */
.empty-slot{width:140px;min-height:120px;border:2px dashed rgba(212,168,67,.3);border-radius:8px;display:flex;align-items:center;justify-content:center;color:rgba(212,168,67,.3);font-size:.8rem}

/* CUSTOMER AREA */
#customer-area{background:rgba(74,32,96,.2);border:2px solid var(--lite);border-radius:10px;padding:1rem;margin:.75rem 0;min-height:120px;text-align:center}
#customer-area .cust-name{font-size:1.2rem;color:var(--gold);font-weight:bold}
#customer-area .cust-emoji{font-size:2.5rem}
#customer-area .cust-want{color:var(--parch-d);font-size:.85rem;margin:.3rem 0}
.sat-bars{display:flex;gap:2rem;justify-content:center;margin-top:.6rem;flex-wrap:wrap}
.sat-bar-group{width:200px}
.sat-bar-group .sat-label{font-size:.75rem;color:var(--parch-d);margin-bottom:3px}
.sat-bar-outer{height:18px;background:#1a0a1e;border:1px solid var(--gold-dim);border-radius:9px;overflow:hidden;position:relative}
.sat-bar-inner{height:100%;border-radius:8px;transition:width .2s}
.sat-bar-inner.player-bar{background:linear-gradient(90deg,var(--blue),#5aaadd)}
.sat-bar-inner.opp-bar{background:linear-gradient(90deg,var(--red),#d06060)}
.sat-bar-text{position:absolute;width:100%;text-align:center;font-size:.65rem;line-height:18px;color:var(--parch);font-weight:bold}
#customer-result{font-size:1.1rem;font-weight:bold;margin-top:.5rem;min-height:1.5rem}
#customer-queue{color:var(--parch-d);font-size:.8rem;margin-top:.3rem}

/* SHOP */
#shop-area{background:rgba(74,32,96,.15);border:2px solid var(--gold-dim);border-radius:10px;padding:1rem;margin-top:.5rem}
#shop-area .shop-title{color:var(--gold);font-size:1rem;font-weight:bold;margin-bottom:.5rem;text-align:center}
#shop-cards{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-bottom:.75rem}
#shop-btns{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}

/* MODAL */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center}
#modal{background:linear-gradient(135deg,var(--purple),var(--deep));border:3px solid var(--gold);border-radius:12px;padding:2rem;max-width:500px;width:90%;text-align:center}
#modal h2{color:var(--gold);margin-bottom:1rem;font-size:1.4rem}
#modal p{color:var(--parch-d);margin-bottom:1rem}
#modal-choices{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin:1rem 0}
#modal-choices .card{cursor:pointer}
#modal-choices .card:hover{transform:translateY(-6px);box-shadow:0 0 20px rgba(212,168,67,.5)}

/* BATTLE LOG */
#battle-log{background:rgba(0,0,0,.3);border:1px solid var(--lite);border-radius:6px;padding:.5rem;margin-top:.5rem;max-height:100px;overflow-y:auto;font-size:.75rem;color:var(--parch-d);line-height:1.5}
#battle-log .log-player{color:#5aaadd}
#battle-log .log-opp{color:#d06060}
#battle-log .log-gold{color:var(--gold)}

/* ROUND END */
#round-end{display:none;text-align:center;padding:2rem}
#round-end h2{color:var(--gold);font-size:1.6rem;margin-bottom:1rem}
#round-end .results{color:var(--parch-d);font-size:1rem;margin-bottom:1.5rem;line-height:2}

/* GAME OVER */
#game-over{display:none;text-align:center;padding:3rem}
#game-over h1{font-size:2.5rem;margin-bottom:.5rem}
#game-over .go-sub{color:var(--parch-d);font-size:1.1rem;margin-bottom:2rem}

/* HAND */
#hand-area{background:rgba(58,26,96,.25);border:2px solid #7a5aaa;border-radius:10px;padding:.75rem;margin-top:.5rem}
#hand-area .hand-title{color:#b090d0;font-size:.85rem;font-weight:bold;margin-bottom:.4rem;text-align:center}
#hand-cards{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;min-height:50px}
#hand-cards .card{width:120px;min-height:90px}

/* LOGO */
#title-logo{max-width:400px;width:80%;margin-bottom:1rem;border-radius:12px}

@keyframes sellPulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes fadeUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-30px)}}
.float-text{position:absolute;pointer-events:none;font-weight:bold;font-size:.9rem;animation:fadeUp .8s forwards;z-index:500}
</style>
</head>
<body>

<!-- TITLE SCREEN -->
<div id="title-screen">
  <img id="title-logo" src="assets/logo.jpeg" alt="Price Charming" onerror="this.style.display='none';document.getElementById('title-fallback').style.display='block'">
  <h1 id="title-fallback" style="display:none">Price Charming</h1>
  <div class="sub">A fairy-tale auto-battler card game</div>
  <div class="ver">V0.0.3-alpha</div>
  <button class="btn" onclick="startGame()">Play</button>
</div>

<!-- GAME SCREEN -->
<div id="game-screen">
  <div id="top-bar">
    <div class="info">
      <div><span class="label">Round </span><span class="val" id="round-num">1</span><span class="label"> / 15</span></div>
      <div><span class="label">Tier </span><span class="val" id="tier-num">1</span></div>
      <div><span class="label">Coins </span><span class="val" id="coin-num">3</span></div>
    </div>
    <div>
      <div style="display:flex;align-items:center;gap:.5rem">
        <span class="label" id="rep-min" style="color:var(--red);font-weight:bold;font-size:.8rem">-30</span>
        <div id="rep-bar-wrap">
          <div id="rep-bar-fill" style="width:50%"></div>
          <div id="rep-bar-mid"></div>
          <div id="rep-text">0</div>
        </div>
        <span class="label" id="rep-max-label" style="color:var(--green);font-weight:bold;font-size:.8rem">30</span>
      </div>
    </div>
  </div>

  <div id="game-area">
    <div id="phase-label">Shopping Phase</div>

    <!-- OPPONENT BOARD (hidden during shop) -->
    <div class="board-section" id="opp-section" style="display:none">
      <div class="board-title">Opponent's Hirelings</div>
      <div class="board-slots" id="opp-board"></div>
    </div>

    <!-- CUSTOMER AREA (battle only) -->
    <div id="customer-area" style="display:none">
      <div class="cust-emoji" id="cust-emoji"></div>
      <div class="cust-name" id="cust-name"></div>
      <div class="cust-want" id="cust-want"></div>
      <div class="sat-bars">
        <div class="sat-bar-group">
          <div class="sat-label">Your Sales</div>
          <div class="sat-bar-outer"><div class="sat-bar-inner player-bar" id="player-sat" style="width:0%"></div><div class="sat-bar-text" id="player-sat-text">0</div></div>
        </div>
        <div class="sat-bar-group">
          <div class="sat-label">Opponent's Sales</div>
          <div class="sat-bar-outer"><div class="sat-bar-inner opp-bar" id="opp-sat" style="width:0%"></div><div class="sat-bar-text" id="opp-sat-text">0</div></div>
        </div>
      </div>
      <div id="customer-result"></div>
      <div id="customer-queue"></div>
    </div>

    <!-- PLAYER BOARD -->
    <div class="board-section" id="player-section">
      <div class="board-title">Your Hirelings</div>
      <div class="board-slots" id="player-board"></div>
    </div>

    <!-- BATTLE LOG -->
    <div id="battle-log" style="display:none"></div>

    <!-- HAND (spells held for later use) -->
    <div id="hand-area" style="display:none">
      <div class="hand-title">Your Hand (spells — click to cast during shop phase)</div>
      <div id="hand-cards"></div>
    </div>

    <!-- SHOP (shopping phase only) -->
    <div id="shop-area">
      <div class="shop-title">Fairy Godmother's Shop</div>
      <div id="shop-cards"></div>
      <div id="shop-btns">
        <button class="btn btn-sm" onclick="refreshShop()">Refresh (1 coin)</button>
        <button class="btn btn-sm btn-blue" onclick="startBattle()">Start Battle</button>
      </div>
    </div>

    <!-- ROUND END -->
    <div id="round-end">
      <h2 id="round-end-title"></h2>
      <div class="results" id="round-end-results"></div>
      <button class="btn" id="round-end-btn" onclick="nextRound()">Next Round</button>
    </div>

    <!-- GAME OVER -->
    <div id="game-over">
      <h1 id="go-title"></h1>
      <div class="go-sub" id="go-sub"></div>
      <button class="btn" onclick="location.reload()">Play Again</button>
    </div>
  </div>
</div>

<!-- MODAL (for spell targeting / transformation choices) -->
<div id="modal-overlay" onclick="closeModal()">
  <div id="modal" onclick="event.stopPropagation()">
    <h2 id="modal-title"></h2>
    <p id="modal-desc"></p>
    <div id="modal-choices"></div>
    <button class="btn btn-sm btn-danger" onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
// ============================================================
// CARD DEFINITIONS
// ============================================================
// Shopable hirelings — transformation results are NOT in this pool
const HIRELINGS_SHOP = [
  {id:'hag',name:'Hag',emoji:'🧙‍♀️',tribe:'mischief',tier:1,desc:'Dubious brews.',potions:[{name:'Murky Brew',stock:2,potency:1}],castTime:3,transformable:true,cost:2},
  {id:'frog',name:'Frog',emoji:'🐸',tribe:'woodland',tier:1,desc:'Hoping for a kiss.',potions:[{name:'Swamp Sip',stock:2,potency:1}],castTime:2,transformable:true,cost:2},
  {id:'hidden-princess',name:'Hidden Princess',emoji:'👸',tribe:'royalty',tier:1,desc:'Waiting to be revealed.',potions:[{name:'Secret Elixir',stock:2,potency:1}],castTime:4,transformable:true,cost:2},
  {id:'little-piggy',name:'Little Piggy',emoji:'🐷',tribe:'culinary',tier:1,desc:'Sniffs out ingredients.',potions:[{name:'Truffle Tonic',stock:3,potency:1}],castTime:2,transformable:false,cost:2},
  {id:'teacups',name:'Teacups',emoji:'🫖',tribe:'enchanted',tier:1,desc:'Pours enchanted tea.',potions:[{name:'Tea Brew',stock:4,potency:1}],castTime:3,transformable:false,cost:2},
  {id:'pumpkin-mouse',name:'Pumpkin Mouse',emoji:'🐭',tribe:'woodland',tier:1,desc:'Quick little brewer.',potions:[{name:'Pumpkin Juice',stock:2,potency:2}],castTime:3,transformable:false,cost:3},
];

// All hirelings including transformation results (for opponent generation / stock restore)
const HIRELINGS_ALL = [
  ...HIRELINGS_SHOP,
  {id:'evil-royal',name:'Evil Royal',emoji:'👑',tribe:'royalty',tier:2,desc:'Wicked & potent.',potions:[{name:'Royal Venom',stock:3,potency:3},{name:'Crown Toxin',stock:2,potency:2}],castTime:3,transformable:false,cost:5},
  {id:'poison-queen',name:'Poison Queen',emoji:'🍎',tribe:'mischief',tier:2,desc:'Deadliest draughts.',potions:[{name:"Queen's Bane",stock:2,potency:4},{name:'Apple Extract',stock:3,potency:2}],castTime:4,transformable:false,cost:5},
  {id:'royal-fly-catch',name:'Royal Fly Catch',emoji:'🐸',tribe:'woodland',tier:2,desc:'Lightning tongue.',potions:[{name:'Fly Fizz',stock:4,potency:2},{name:'Tongue Tonic',stock:2,potency:3}],castTime:1,transformable:false,cost:5},
  {id:'wart-covered-prince',name:'Wart Covered Prince',emoji:'🤴',tribe:'royalty',tier:2,desc:'Cursed but charming.',potions:[{name:'Wartbrew',stock:3,potency:2},{name:"Prince's Perfume",stock:2,potency:3}],castTime:3,transformable:false,cost:5},
  {id:'snow-white',name:'Snow White',emoji:'❄️',tribe:'royalty',tier:2,desc:'Fairest potions.',potions:[{name:'Mirror Mist',stock:3,potency:3},{name:'Apple Blossom Dew',stock:3,potency:3}],castTime:3,transformable:false,cost:5},
  {id:'master-pie-maker',name:'Master Pie Maker',emoji:'🥧',tribe:'culinary',tier:2,desc:'Bakes potion pies.',potions:[{name:'Pie Potion',stock:4,potency:2},{name:'Crust Elixir',stock:3,potency:2}],castTime:2,transformable:false,cost:5},
];

const SPELLS = [
  {id:'wishing-star',name:'Wishing Star',emoji:'⭐',desc:'Transform a hireling.',cost:2,kind:'transform'},
  {id:'potency-boost',name:'Potency Boost',emoji:'💪',desc:'+1 potency to a hireling.',cost:1,kind:'potency'},
  {id:'quick-brew',name:'Quick Brew',emoji:'⚡',desc:'-1s cast time (min 1s).',cost:1,kind:'speed'},
];

const TRANSFORMATIONS = {
  'hag':[
    {id:'evil-royal',name:'Evil Royal',emoji:'👑',tribe:'royalty',tier:2,potions:[{name:'Royal Venom',stock:3,potency:3},{name:'Crown Toxin',stock:2,potency:2}],castTime:3},
    {id:'poison-queen',name:'Poison Queen',emoji:'🍎',tribe:'mischief',tier:2,potions:[{name:"Queen's Bane",stock:2,potency:4},{name:'Apple Extract',stock:3,potency:2}],castTime:4}
  ],
  'frog':[
    {id:'royal-fly-catch',name:'Royal Fly Catch',emoji:'🐸',tribe:'woodland',tier:2,potions:[{name:'Fly Fizz',stock:4,potency:2},{name:'Tongue Tonic',stock:2,potency:3}],castTime:1},
    {id:'wart-covered-prince',name:'Wart Covered Prince',emoji:'🤴',tribe:'royalty',tier:2,potions:[{name:'Wartbrew',stock:3,potency:2},{name:"Prince's Perfume",stock:2,potency:3}],castTime:3}
  ],
  'hidden-princess':[
    {id:'snow-white',name:'Snow White',emoji:'❄️',tribe:'royalty',tier:2,potions:[{name:'Mirror Mist',stock:3,potency:3},{name:'Apple Blossom Dew',stock:3,potency:3}],castTime:3},
    {id:'master-pie-maker',name:'Master Pie Maker',emoji:'🥧',tribe:'culinary',tier:2,potions:[{name:'Pie Potion',stock:4,potency:2},{name:'Crust Elixir',stock:3,potency:2}],castTime:2}
  ]
};

const CUSTOMERS = [
  {name:'Gretel',emoji:'👧',threshold:3,gold:2,rep:3},
  {name:'Jack',emoji:'🧑',threshold:4,gold:3,rep:4},
  {name:'Red Riding Hood',emoji:'🧣',threshold:2,gold:1,rep:2},
  {name:'Goldilocks',emoji:'👱‍♀️',threshold:5,gold:3,rep:5},
  {name:'Rapunzel',emoji:'👩‍🦰',threshold:3,gold:2,rep:3},
  {name:'Hansel',emoji:'👦',threshold:3,gold:2,rep:3},
  {name:'Cinderella',emoji:'💃',threshold:4,gold:3,rep:4},
  {name:'The Baker',emoji:'👨‍🍳',threshold:6,gold:4,rep:5},
  {name:'Pied Piper',emoji:'🎵',threshold:4,gold:3,rep:4},
  {name:'Old King Cole',emoji:'🤴',threshold:5,gold:4,rep:5},
];

// ============================================================
// GAME STATE
// ============================================================
let G = {};
function resetState() {
  G = {
    phase:'title',round:1,coins:3,reputation:0,repMax:30,
    board:[],shop:[],hand:[], // hand holds up to 5 spell cards
    opp:{board:[]},
    customers:[],custIdx:0,
    playerSat:0,oppSat:0,
    battleTimer:null,battleSpeed:100,
    roundGold:0,roundRep:0,custWins:0,custLosses:0,
    pendingSpell:null,
  };
}
resetState();

function getTier(round){return round<=3?1:round<=6?2:3}
function deepCopyCard(c){return {...c,potions:c.potions.map(p=>({...p}))}}

// ============================================================
// SOUND EFFECTS (Web Audio API — no external files needed)
// ============================================================
const AudioCtx=window.AudioContext||window.webkitAudioContext;
let audioCtx=null;
function ensureAudio(){if(!audioCtx)audioCtx=new AudioCtx()}

function playBuy(){
  ensureAudio();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  o.type='triangle';o.frequency.setValueAtTime(600,audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(900,audioCtx.currentTime+.1);
  g.gain.setValueAtTime(.15,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.2);
  o.start();o.stop(audioCtx.currentTime+.2);
}

function playSell(){
  ensureAudio();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  o.type='sine';o.frequency.setValueAtTime(400,audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(200,audioCtx.currentTime+.15);
  g.gain.setValueAtTime(.12,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.15);
  o.start();o.stop(audioCtx.currentTime+.15);
}

function playPotionSell(){
  ensureAudio();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  o.type='sine';o.frequency.setValueAtTime(500+Math.random()*200,audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(800+Math.random()*200,audioCtx.currentTime+.08);
  g.gain.setValueAtTime(.08,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.12);
  o.start();o.stop(audioCtx.currentTime+.12);
}

function playCustomerWin(){
  ensureAudio();
  [0,.1,.2].forEach((d,i)=>{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.type='triangle';o.frequency.setValueAtTime([523,659,784][i],audioCtx.currentTime+d);
    g.gain.setValueAtTime(.12,audioCtx.currentTime+d);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d+.2);
    o.start(audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d+.2);
  });
}

function playCustomerLose(){
  ensureAudio();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  o.type='sawtooth';o.frequency.setValueAtTime(300,audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(100,audioCtx.currentTime+.3);
  g.gain.setValueAtTime(.08,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.3);
  o.start();o.stop(audioCtx.currentTime+.3);
}

function playRefresh(){
  ensureAudio();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  o.type='sine';o.frequency.setValueAtTime(800,audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(400,audioCtx.currentTime+.15);
  g.gain.setValueAtTime(.1,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.15);
  o.start();o.stop(audioCtx.currentTime+.15);
}

function playSpellCast(){
  ensureAudio();
  [0,.05,.1,.15].forEach((d,i)=>{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.type='sine';o.frequency.setValueAtTime(600+i*150,audioCtx.currentTime+d);
    g.gain.setValueAtTime(.1,audioCtx.currentTime+d);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d+.15);
    o.start(audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d+.15);

// ============================================================
// GAME FLOW
// ============================================================
function startGame(){
  resetState();
  document.getElementById('title-screen').style.display='none';
  document.getElementById('game-screen').style.display='flex';
  enterShopping();
}

function enterShopping(){
  G.phase='shopping';
  G.coins+=G.round; // round income
  if(G.round===1) G.coins=3;
  updateTopBar();
  generateShop();
  renderAll();
}

function generateShop(){
  const tier=getTier(G.round);
  const pool=HIRELINGS_SHOP.filter(h=>h.tier<=tier);
  G.shop=[];
  for(let i=0;i<4;i++){
    if(Math.random()<0.3 && SPELLS.length>0){
      const sp={...SPELLS[Math.floor(Math.random()*SPELLS.length)],type:'spell'};
      G.shop.push(sp);
    } else {
      const h=deepCopyCard(pool[Math.floor(Math.random()*pool.length)]);
      h.type='hireling';
      G.shop.push(h);
    }
  }
}

function refreshShop(){
  if(G.coins<1){showFloat(document.getElementById('shop-btns'),'No coins!','var(--red)');return}
  G.coins--;
  playRefresh();
  generateShop();
  updateTopBar();
  renderShop();
}

function buyCard(idx){
  const item=G.shop[idx];
  if(!item)return;
  if(G.coins<item.cost){showFloat(document.getElementById('shop-cards'),'Not enough coins!','var(--red)');return}
  if(item.type==='spell'){
    if(G.hand.length>=5){showFloat(document.getElementById('shop-cards'),'Hand full! (max 5)','var(--red)');return}
    G.coins-=item.cost;
    G.shop[idx]=null;
    G.hand.push({...item});
    playBuy();
    updateTopBar();
    renderAll();
    return;
  }
  // hireling
  if(G.board.length>=5){showFloat(document.getElementById('shop-cards'),'Board full!','var(--red)');return}
  G.coins-=item.cost;
  const card=deepCopyCard(item);
  card._timer=card.castTime;
  G.board.push(card);
  G.shop[idx]=null;
  playBuy();
  updateTopBar();
  renderAll();
}

function sellCard(idx){
  if(G.phase!=='shopping')return;
  G.board.splice(idx,1);
  G.coins++;
  playSell();
  updateTopBar();
  renderAll();
}

function playHandSpell(handIdx){
  if(G.phase!=='shopping')return;
  const spell=G.hand[handIdx];
  if(!spell)return;
  G.hand.splice(handIdx,1);
  handleSpell(spell);
  renderAll();
}

// ============================================================
// SPELLS
// ============================================================
function handleSpell(spell){
  if(G.board.length===0){
    showFloat(document.getElementById('shop-cards'),'No hirelings to target!','var(--red)');
    G.coins+=spell.cost;
    return;
  }
  G.pendingSpell=spell;
  if(spell.kind==='transform'){
    const targets=G.board.filter(h=>h.transformable);
    if(targets.length===0){
      showFloat(document.getElementById('shop-cards'),'No transformable hirelings!','var(--red)');
      G.coins+=spell.cost;G.pendingSpell=null;return;
    }
    openTargetModal('Choose a hireling to transform',G.board.filter(h=>h.transformable),doTransform);
  } else if(spell.kind==='potency'){
    openTargetModal('Choose a hireling to boost potency',G.board,doPotencyBoost);
  } else if(spell.kind==='speed'){
    openTargetModal('Choose a hireling to speed up',G.board.filter(h=>h.castTime>1),doSpeedBoost);
    if(G.board.filter(h=>h.castTime>1).length===0){
      showFloat(document.getElementById('shop-cards'),'All at min speed!','var(--red)');
      G.coins+=spell.cost;G.pendingSpell=null;closeModal();return;
    }
  }
}

function doTransform(hireling){
  closeModal();
  const paths=TRANSFORMATIONS[hireling.id];
  if(!paths){G.pendingSpell=null;return;}
  // show choice modal
  const el=document.getElementById('modal-choices');
  el.innerHTML='';
  document.getElementById('modal-title').textContent='Choose Transformation';
  document.getElementById('modal-desc').textContent=hireling.name+' transforms into...';
  paths.forEach((opt,i)=>{
    const card=document.createElement('div');
    card.className='card clickable';
    card.innerHTML=`<div class="emoji">${opt.emoji}</div><div class="c-name">${opt.name}</div>
      <div style="text-align:center"><span class="c-tribe">${opt.tribe}</span></div>
      <div class="c-info">${opt.potions.map(p=>p.name+' ('+p.potency+'✦ x'+p.stock+')').join('<br>')}<br>Cast: ${opt.castTime}s</div>`;
    card.onclick=()=>{
      const idx=G.board.findIndex(c=>c===hireling);
      if(idx===-1)return;
      const newCard=deepCopyCard({...opt,type:'hireling',transformable:false,cost:5});
      newCard._timer=newCard.castTime;
      G.board[idx]=newCard;
      G.pendingSpell=null;
      playSpellCast();
      closeModal();
      renderAll();
    };
    el.appendChild(card);
  });
  document.getElementById('modal-overlay').style.display='flex';
}

function doPotencyBoost(hireling){
  hireling.potions.forEach(p=>p.potency++);
  G.pendingSpell=null;
  playSpellCast();
  closeModal();renderAll();
}

function doSpeedBoost(hireling){
  hireling.castTime=Math.max(1,hireling.castTime-1);
  G.pendingSpell=null;
  playSpellCast();
  closeModal();renderAll();
}

function openTargetModal(title,targets,callback){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-desc').textContent='Click a hireling:';
  const el=document.getElementById('modal-choices');
  el.innerHTML='';
  targets.forEach(h=>{
    const card=document.createElement('div');
    card.className='card clickable';
    card.innerHTML=`<div class="emoji">${h.emoji}</div><div class="c-name">${h.name}</div>
      <div class="c-info">${h.potions.map(p=>p.name+' '+p.potency+'✦').join(', ')}<br>Cast: ${h.castTime}s</div>`;
    card.onclick=()=>callback(h);
    el.appendChild(card);
  });
  document.getElementById('modal-overlay').style.display='flex';
}

function closeModal(){
  document.getElementById('modal-overlay').style.display='none';
  G.pendingSpell=null;
}

// ============================================================
// BATTLE
// ============================================================
function startBattle(){
  if(G.board.length===0){showFloat(document.getElementById('shop-btns'),'Hire at least one hireling!','var(--red)');return}
  G.phase='battle';
  generateOpponent();
  generateCustomers();
  G.custIdx=0;G.roundGold=0;G.roundRep=0;G.custWins=0;G.custLosses=0;
  // reset timers
  G.board.forEach(h=>{h._timer=h.castTime;h._potIdx=0});
  G.opp.board.forEach(h=>{h._timer=h.castTime;h._potIdx=0});
  renderAll();
  loadNextCustomer();
}

function generateOpponent(){
  const tier=getTier(G.round);
  const pool=HIRELINGS_SHOP.filter(h=>h.tier<=tier);
  // Measure player strength: total potency output
  const playerStrength=G.board.reduce((s,h)=>s+h.potions.reduce((ps,p)=>ps+p.potency*p.stock,0),0);
  // Opponent should have comparable or slightly higher strength as rounds progress
  const count=Math.min(5,Math.max(G.board.length,Math.floor(G.round/2)+1+Math.floor(Math.random()*2)));
  G.opp.board=[];
  let oppStrength=0;
  const targetStrength=playerStrength*(0.85+G.round*0.04+Math.random()*0.2);
  for(let i=0;i<count;i++){
    const h=deepCopyCard(pool[Math.floor(Math.random()*pool.length)]);
    h.type='hireling';h._timer=h.castTime;h._potIdx=0;
    // Scale opponent potions based on round to keep up with player upgrades
    const potencyBonus=Math.floor(G.round/4);
    const stockBonus=Math.floor(G.round/5);
    h.potions.forEach(p=>{p.potency+=potencyBonus;p.stock+=stockBonus});
    G.opp.board.push(h);
    oppStrength+=h.potions.reduce((ps,p)=>ps+p.potency*p.stock,0);
  }
  // If still too weak, buff the existing hirelings
  if(oppStrength<targetStrength&&G.opp.board.length>0){
    const deficit=targetStrength-oppStrength;
    const perCard=Math.ceil(deficit/G.opp.board.length);
    G.opp.board.forEach(h=>{
      const mainPot=h.potions[0];
      if(mainPot){
        const bonus=Math.ceil(perCard/Math.max(1,mainPot.stock));
        mainPot.potency+=bonus;
      }
    });
  }
}

function generateCustomers(){
  const count=3+Math.floor(G.round/3);
  const shuffled=[...CUSTOMERS].sort(()=>Math.random()-.5);
  G.customers=shuffled.slice(0,Math.min(count,shuffled.length)).map(c=>({...c}));
}

function loadNextCustomer(){
  if(G.custIdx>=G.customers.length){endBattle();return}
  G.playerSat=0;G.oppSat=0;
  // restore potion stock for the round's board (stock persists per round)
  document.getElementById('customer-result').textContent='';
  renderAll();
  // start battle tick
  G.battleTimer=setInterval(battleTick,G.battleSpeed);
}

function battleTick(){
  if(G.phase!=='battle')return;
  const cust=G.customers[G.custIdx];
  if(!cust)return;
  const dt=G.battleSpeed/1000;

  // tick player hirelings
  G.board.forEach(h=>{
    if(isExhausted(h))return;
    h._timer-=dt;
    if(h._timer<=0){
      const pot=getNextPotion(h);
      if(pot){
        pot.stock--;
        G.playerSat+=pot.potency;
        addLog(`<span class="log-player">Your ${h.name}</span> sold ${pot.name} (+${pot.potency})`);
        flashCard(h.id,'player');
        playPotionSell();
      }
      h._timer=h.castTime;
    }
  });

  // tick opponent hirelings
  G.opp.board.forEach(h=>{
    if(isExhausted(h))return;
    h._timer-=dt;
    if(h._timer<=0){
      const pot=getNextPotion(h);
      if(pot){
        pot.stock--;
        G.oppSat+=pot.potency;
        addLog(`<span class="log-opp">Opp ${h.name}</span> sold ${pot.name} (+${pot.potency})`);
        flashCard(h.id,'opp');
      }
      h._timer=h.castTime;
    }
  });

  renderBattle();

  // check if customer satisfied
  if(G.playerSat>=cust.threshold && G.oppSat>=cust.threshold){
    customerDone(G.playerSat>=G.oppSat?'player':'opp',cust);
  } else if(G.playerSat>=cust.threshold){
    customerDone('player',cust);
  } else if(G.oppSat>=cust.threshold){
    customerDone('opp',cust);
  } else if(allExhausted(G.board)&&allExhausted(G.opp.board)){
    customerDone(G.playerSat>=G.oppSat?'player':'opp',cust);
  }
}

function getNextPotion(h){
  for(let i=0;i<h.potions.length;i++){
    if(h.potions[i].stock>0)return h.potions[i];
  }
  return null;
}

function isExhausted(h){return !h.potions.some(p=>p.stock>0)}
function allExhausted(board){return board.every(isExhausted)}

function customerDone(winner,cust){
  clearInterval(G.battleTimer);
  const res=document.getElementById('customer-result');
  if(winner==='player'){
    G.roundGold+=cust.gold;G.roundRep+=cust.rep;G.custWins++;
    G.coins+=cust.gold;
    res.innerHTML=`<span style="color:var(--green)">You won ${cust.name}'s business! +${cust.gold} coins, +${cust.rep} rep</span>`;
    addLog(`<span class="log-gold">Won ${cust.name}: +${cust.gold} coins, +${cust.rep} rep</span>`);
    playCustomerWin();
  } else {
    G.roundRep-=Math.ceil(cust.rep/2);G.custLosses++;
    res.innerHTML=`<span style="color:var(--red)">Opponent won ${cust.name}! -${Math.ceil(cust.rep/2)} rep</span>`;
    addLog(`<span class="log-opp">Lost ${cust.name}: -${Math.ceil(cust.rep/2)} rep</span>`);
    playCustomerLose();
  }
  updateTopBar();
  setTimeout(()=>{
    G.custIdx++;
    if(G.custIdx<G.customers.length){
      loadNextCustomer();
    } else {
      endBattle();
    }
  },1500);
}

function endBattle(){
  clearInterval(G.battleTimer);
  G.phase='round_end';
  G.reputation+=G.roundRep;
  // restore potion stock for next round
  G.board.forEach(h=>h.potions.forEach(p=>{
    const orig=HIRELINGS_ALL.find(o=>o.id===h.id);
    if(orig){
      const op=orig.potions.find(op2=>op2.name===p.name);
      if(op)p.stock=op.stock;
    } else {
      // custom/buffed card - restore to reasonable baseline
      p.stock=Math.max(p.stock,2);
    }
  }));
  updateTopBar();
  renderAll();
}

function nextRound(){
  if(G.reputation>=G.repMax){gameOver(true);return}
  if(G.reputation<=-G.repMax){gameOver(false);return}
  G.round++;
  if(G.round>15){
    gameOver(G.reputation>0);return;
  }
  // crunch
  if(G.round===13)G.repMax=25;
  if(G.round===14)G.repMax=20;
  if(G.round===15)G.repMax=15;
  if(G.reputation<-G.repMax)G.reputation=-G.repMax;
  if(G.reputation>G.repMax)G.reputation=G.repMax;
  enterShopping();
}

function gameOver(won){
  G.phase='gameover';
  renderAll();
  const title=document.getElementById('go-title');
  const sub=document.getElementById('go-sub');
  if(won){
    title.style.color='var(--gold)';
    title.textContent='Victory!';
    sub.textContent='Your potion shop reigns supreme! Round '+G.round+', Rep: '+G.reputation;
  } else {
    title.style.color='var(--red)';
    title.textContent='Defeat';
    sub.textContent='The competition was too fierce. Round '+G.round+', Rep: '+G.reputation;
  }
}

// ============================================================
// RENDERING
// ============================================================
function renderAll(){
  const shopArea=document.getElementById('shop-area');
  const oppSec=document.getElementById('opp-section');
  const custArea=document.getElementById('customer-area');
  const logEl=document.getElementById('battle-log');
  const roundEnd=document.getElementById('round-end');
  const gameOverEl=document.getElementById('game-over');
  const playerSec=document.getElementById('player-section');
  const phaseLabel=document.getElementById('phase-label');
  const handArea=document.getElementById('hand-area');

  // hide all
  shopArea.style.display='none';
  oppSec.style.display='none';
  custArea.style.display='none';
  logEl.style.display='none';
  roundEnd.style.display='none';
  gameOverEl.style.display='none';
  playerSec.style.display='block';
  handArea.style.display='none';

  if(G.phase==='shopping'){
    phaseLabel.textContent='Shopping Phase — Round '+G.round;
    shopArea.style.display='block';
    if(G.hand.length>0)handArea.style.display='block';
    renderBoard('player-board',G.board,true);
    renderShop();
    renderHand();
  } else if(G.phase==='battle'){
    phaseLabel.textContent='Battle Phase — Round '+G.round;
    oppSec.style.display='block';
    custArea.style.display='block';
    logEl.style.display='block';
    renderBoard('player-board',G.board,false);
    renderBoard('opp-board',G.opp.board,false);
    renderBattle();
  } else if(G.phase==='round_end'){
    phaseLabel.textContent='Round '+G.round+' Complete';
    roundEnd.style.display='block';
    playerSec.style.display='none';
    const t=document.getElementById('round-end-title');
    const r=document.getElementById('round-end-results');
    t.textContent=G.custWins>G.custLosses?'Good Round!':G.custWins===G.custLosses?'Close Round':'Tough Round';
    r.innerHTML=`Customers Won: <strong style="color:var(--green)">${G.custWins}</strong> &nbsp; Lost: <strong style="color:var(--red)">${G.custLosses}</strong><br>
      Gold Earned: <strong style="color:var(--gold)">${G.roundGold}</strong><br>
      Reputation Change: <strong style="color:${G.roundRep>=0?'var(--green)':'var(--red)'}">${G.roundRep>=0?'+':''}${G.roundRep}</strong><br>
      Total Reputation: <strong>${G.reputation}</strong> / ${G.repMax}`;
    const btn=document.getElementById('round-end-btn');
    if(G.reputation>=G.repMax){btn.textContent='Victory!';btn.onclick=()=>gameOver(true)}
    else if(G.reputation<=-G.repMax){btn.textContent='Defeat...';btn.onclick=()=>gameOver(false)}
    else if(G.round>=15){btn.textContent=G.reputation>0?'Victory!':'Defeat...';btn.onclick=()=>gameOver(G.reputation>0)}
    else{btn.textContent='Next Round';btn.onclick=nextRound}
  } else if(G.phase==='gameover'){
    phaseLabel.textContent='';
    playerSec.style.display='none';
    gameOverEl.style.display='block';
  }
  updateTopBar();
}

function renderBoard(containerId,board,showSell){
  const el=document.getElementById(containerId);
  el.innerHTML='';
  const maxSlots=5;
  for(let i=0;i<maxSlots;i++){
    if(i<board.length){
      const h=board[i];
      const card=document.createElement('div');
      const ex=isExhausted(h);
      card.className='card'+(ex?' exhausted':'');
      card.id=containerId+'-card-'+i;
      card.dataset.cardId=h.id;
      const potInfo=h.potions.map(p=>`${p.name}: ${p.potency}✦ x${p.stock}`).join('<br>');
      const timerPct=G.phase==='battle'?Math.max(0,Math.min(100,(1-h._timer/h.castTime)*100)):0;
      card.innerHTML=`<div class="emoji">${h.emoji}</div>
        <div class="c-name">${h.name}</div>
        <div style="text-align:center"><span class="c-tribe">${h.tribe} · T${h.tier||1}</span></div>
        <div class="c-info">${potInfo}<br>Cast: ${h.castTime}s</div>
        ${G.phase==='battle'?`<div class="c-timer-bar"><div class="c-timer-fill" style="width:${timerPct}%"></div></div>`:''}
        ${showSell?`<button class="sell-btn" onclick="event.stopPropagation();sellCard(${i})">Sell 1g</button>`:''}`;
      el.appendChild(card);
    } else {
      const empty=document.createElement('div');
      empty.className='empty-slot';
      empty.textContent='Empty';
      el.appendChild(empty);
    }
  }
}

function renderShop(){
  const el=document.getElementById('shop-cards');
  el.innerHTML='';
  G.shop.forEach((item,i)=>{
    if(!item){
      const empty=document.createElement('div');
      empty.className='empty-slot';
      empty.textContent='Sold';
      el.appendChild(empty);
      return;
    }
    const card=document.createElement('div');
    if(item.type==='spell'){
      card.className='card spell-card clickable';
      card.innerHTML=`<div class="c-cost">${item.cost}g</div>
        <div class="emoji">${item.emoji}</div>
        <div class="c-name">${item.name}</div>
        <div style="text-align:center"><span class="c-tribe" style="background:#7a5aaa;color:var(--parch)">Spell</span></div>
        <div class="c-info">${item.desc}</div>`;
    } else {
      card.className='card clickable';
      const potInfo=item.potions.map(p=>`${p.name}: ${p.potency}✦ x${p.stock}`).join('<br>');
      card.innerHTML=`<div class="c-cost">${item.cost}g</div>
        <div class="emoji">${item.emoji}</div>
        <div class="c-name">${item.name}</div>
        <div style="text-align:center"><span class="c-tribe">${item.tribe} · T${item.tier}</span></div>
        <div class="c-info">${potInfo}<br>Cast: ${item.castTime}s</div>
        ${item.transformable?'<div style="text-align:center;margin-top:2px"><span style="font-size:.6rem;color:#b090d0">✦ Transformable</span></div>':''}`;
    }
    card.onclick=()=>buyCard(i);
    el.appendChild(card);
  });
}

function renderBattle(){
  const cust=G.customers[G.custIdx];
  if(!cust)return;
  document.getElementById('cust-emoji').textContent=cust.emoji;
  document.getElementById('cust-name').textContent=cust.name;
  document.getElementById('cust-want').textContent=`Wants ${cust.threshold} potion points — Pays ${cust.gold} gold, ${cust.rep} rep`;
  const pPct=Math.min(100,(G.playerSat/cust.threshold)*100);
  const oPct=Math.min(100,(G.oppSat/cust.threshold)*100);
  document.getElementById('player-sat').style.width=pPct+'%';
  document.getElementById('player-sat-text').textContent=G.playerSat+'/'+cust.threshold;
  document.getElementById('opp-sat').style.width=oPct+'%';
  document.getElementById('opp-sat-text').textContent=G.oppSat+'/'+cust.threshold;
  document.getElementById('customer-queue').textContent=`Customer ${G.custIdx+1} of ${G.customers.length}`;
  // update timer bars
  G.board.forEach((h,i)=>{
    const fill=document.querySelector(`#player-board-card-${i} .c-timer-fill`);
    if(fill){
      const pct=Math.max(0,Math.min(100,(1-h._timer/h.castTime)*100));
      fill.style.width=pct+'%';
    }
  });
  G.opp.board.forEach((h,i)=>{
    const fill=document.querySelector(`#opp-board-card-${i} .c-timer-fill`);
    if(fill){
      const pct=Math.max(0,Math.min(100,(1-h._timer/h.castTime)*100));
      fill.style.width=pct+'%';
    }
  });
}

function updateTopBar(){
  document.getElementById('round-num').textContent=G.round;
  document.getElementById('tier-num').textContent=getTier(G.round);
  document.getElementById('coin-num').textContent=G.coins;
  const repPct=((G.reputation+G.repMax)/(2*G.repMax))*100;
  document.getElementById('rep-bar-fill').style.width=Math.max(2,Math.min(98,repPct))+'%';
  document.getElementById('rep-text').textContent=G.reputation+' / '+G.repMax;
  document.getElementById('rep-min').textContent='-'+G.repMax;
  document.getElementById('rep-max-label').textContent=G.repMax;
}

function renderHand(){
  const el=document.getElementById('hand-cards');
  el.innerHTML='';
  G.hand.forEach((spell,i)=>{
    const card=document.createElement('div');
    card.className='card spell-card clickable';
    card.innerHTML=`<div class="emoji">${spell.emoji}</div>
      <div class="c-name">${spell.name}</div>
      <div class="c-info">${spell.desc}</div>`;
    card.onclick=()=>playHandSpell(i);
    el.appendChild(card);
  });
}

// ============================================================
// UTILITIES
// ============================================================
function addLog(html){
  const el=document.getElementById('battle-log');
  const line=document.createElement('div');
  line.innerHTML=html;
  el.appendChild(line);
  el.scrollTop=el.scrollHeight;
}

function flashCard(cardId,side){
  const prefix=side==='player'?'player-board':'opp-board';
  const cards=document.querySelectorAll(`#${prefix} .card`);
  cards.forEach(c=>{
    if(c.dataset.cardId===cardId){
      c.classList.add('selling');
      setTimeout(()=>c.classList.remove('selling'),300);
    }
  });
}

function showFloat(parent,text,color){
  const el=document.createElement('div');
  el.className='float-text';
  el.textContent=text;
  el.style.color=color||'var(--gold)';
  el.style.left='50%';el.style.top='50%';el.style.transform='translate(-50%,-50%)';
  parent.style.position='relative';
  parent.appendChild(el);
  setTimeout(()=>el.remove(),800);
}
</script>
